<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>人を大切にするための手引き</title>
<meta name="theme-color" content="#f5f1e8">
<link rel="manifest" href="site.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root { --paper: #f5f1e8; --ink: #26221e; --muted: #766f65; --line: #d7d0c4; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink); font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif; }
  #reader-app { height: 100%; }
  header { height: 62px; padding: 12px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; }
  header span { font-size: 13px; color: var(--muted); letter-spacing: .1em; }
  #chapter-picker { max-width: min(420px, 70vw); padding: 7px; border: 1px solid var(--line); border-radius: 4px; background: #fffdf8; color: var(--ink); }
  #reader { height: calc(100% - 62px); overflow-x: auto; overflow-y: hidden; padding: 30px 36px; writing-mode: vertical-rl; text-orientation: mixed; }
  article { height: 100%; line-height: 2; font-size: clamp(17px, 2.2vw, 21px); letter-spacing: .08em; }
  h1, h2 { font-weight: 500; margin: 0 0 1.8em; }
  h1 { font-size: 1.45em; }
  h2 { font-size: 1em; color: var(--muted); }
  p { margin: 0; margin-block-end: 1.7em; max-height: 100%; text-indent: 1em; }
  ul { margin: 0 0 1.4em; padding: 0 1.4em 0 0; }
  li { margin-left: .8em; }
  .tate-num { text-combine-upright: all; text-orientation: upright; }
  .rule { border-left: 1px solid var(--line); height: 65%; margin: 0 1.7em; }
  .loading { writing-mode: horizontal-tb; color: var(--muted); }
  @media (max-width: 600px) { #reader { padding: 24px 22px; } header { padding: 10px 12px; } }
</style>
</head>
<body>
<div id="reader-app">
  <header><span>イヘウヨFACE</span><select id="chapter-picker" aria-label="章を選ぶ"></select></header>
  <main id="reader"><p class="loading">読み込み中です。</p></main>
</div>
<script>
const picker = document.getElementById('chapter-picker');
const reader = document.getElementById('reader');
let book;
const escapeHtml = (text) => text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const formatText = (text) => escapeHtml(text).replace(/[0-9]+/g, (number) => '<span class="tate-num">' + number + '</span>');
function renderMarkdown(md) {
  const lines = md.split('\n'); let html = ''; let list = false;
  const closeList = () => { if (list) { html += '</ul>'; list = false; } };
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) continue;
    if (line === '---') { closeList(); html += '<div class="rule"></div>'; continue; }
    if (line.startsWith('# ')) { closeList(); html += '<h1>' + formatText(line.slice(2)) + '</h1>'; continue; }
    if (line.startsWith('## ')) { closeList(); html += '<h2>' + formatText(line.slice(3)) + '</h2>'; continue; }
    if (line.startsWith('- ')) { if (!list) { html += '<ul>'; list = true; } html += '<li>' + formatText(line.slice(2)) + '</li>'; continue; }
    closeList(); html += '<p>' + formatText(line) + '</p>';
  }
  closeList(); return html;
}
async function showChapter(index) {
  const chapter = book.chapters[index];
  const res = await fetch(chapter.path, { cache: 'no-store' });
  if (!res.ok) throw new Error('原稿を開けませんでした。');
  reader.innerHTML = '<article>' + renderMarkdown(await res.text()) + '</article>';
  reader.scrollTo({ left: reader.scrollWidth, behavior: 'auto' });
}
async function start() {
  const res = await fetch('manifest.json', { cache: 'no-store' });
  book = await res.json();
  picker.innerHTML = book.chapters.map((chapter, i) => '<option value="' + i + '">' + chapter.id + '　' + chapter.title + '</option>').join('');
  picker.addEventListener('change', () => showChapter(Number(picker.value)).catch((e) => reader.innerHTML = '<p class="loading">' + escapeHtml(e.message) + '</p>'));
  await showChapter(0);
}
start().catch((e) => { reader.innerHTML = '<p class="loading">' + escapeHtml(e.message) + '</p>'; });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
